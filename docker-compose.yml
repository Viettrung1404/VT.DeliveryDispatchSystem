version: '3.8'

services:
  # 1. PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:15-3.3
    container_name: dds_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dispatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dds_network
    restart: unless-stopped

  # 2. Redis with RedisGeo
  redis:
    image: redis:7-alpine
    container_name: dds_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dds_network
    restart: unless-stopped

  # 3. Apache Kafka (KRaft mode - no Zookeeper needed)
  kafka:
    image: soldevelo/kafka:3.5
    container_name: dds_kafka
    environment:
      # KRaft settings
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - dds_network
    restart: unless-stopped

  # 4. GraphHopper (Routing Engine)
  graphhopper:
    image: graphhopper/graphhopper:8.0
    container_name: dds_graphhopper
    # Command to download Vietnam map and start
    command: >
      bash -c "
      if [ ! -f /data/map.osm.pbf ]; then
        echo 'Downloading Vietnam map...';
        wget -O /data/map.osm.pbf https://download.geofabrik.de/asia/vietnam-latest.osm.pbf;
      fi;
      java -Ddw.graphhopper.datareader.file=/data/map.osm.pbf -jar *.jar server config-example.yml
      "
    ports:
      - "8989:8989"
    volumes:
      - graphhopper_data:/data
    networks:
      - dds_network
    restart: unless-stopped

networks:
  dds_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  graphhopper_data:
